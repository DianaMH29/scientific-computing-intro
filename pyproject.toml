[project]
name = "data-ecosystem-gb-santander"
version = "0.1.0"
description = "Science Computing"
requires-python = ">=3.10"
authors = [{ name = "Diana Martinez" }]

[project.optional-dependencies]
dev = ["ipykernel"]
ml = ["pandas", "math", "scikit-learn"]
viz = ["matplotlib", "seaborn", "plotly"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
